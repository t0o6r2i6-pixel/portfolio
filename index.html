<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>自己紹介</title>
<style>
  :root{
    --bg:#0b1220;
    --card:#121a2b;
    --text:#e8eefc;
    --muted:#a9b5d6;
    --accent:#7aa2ff;
    --border:rgba(255,255,255,.10);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 400px at 10% 10%, rgba(122,162,255,.25), transparent 60%),
      radial-gradient(700px 300px at 90% 20%, rgba(98,216,202,.18), transparent 60%),
      var(--bg);
    color: var(--text);
    line-height: 1.8;
  }

  .container{
    max-width: 860px;
    margin: 48px auto;
    padding: 0 18px;
  }

  header{
    padding: 26px 22px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }

  h1{
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: .02em;
  }

  .subtitle{
    margin:0;
    color: var(--muted);
    font-size: 14px;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }

  section{
    padding: 18px 18px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(255,255,255,.04);
  }

  h2{
    margin: 0 0 10px;
    font-size: 16px;
    color: var(--muted);
    font-weight: 700;
  }

  p{ margin:0; font-size: 16px; }

  .tag{
    display:inline-block;
    margin-top:10px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--border);
    background: rgba(122,162,255,.12);
    color: var(--text);
    font-size: 12px;
  }

  footer{
    margin-top: 18px;
    color: var(--muted);
    font-size: 12px;
    text-align:center;
  }

  @media (max-width: 720px){
    .grid{ grid-template-columns: 1fr; }
    h1{ font-size: 24px; }
  }
</style></head>
<body>

<html lang="ja">

</head>

</body>
</html>

</body>
</html>
