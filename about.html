<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自己紹介</title>
  <style>
    :root{--bg:#0b1220;--card:#121a2b;--text:#e8eefc;--muted:#a9b5d6;--accent:#7aa2ff;--border:rgba(255,255,255,.10);}
    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:
      radial-gradient(900px 400px at 10% 10%, rgba(122,162,255,.25), transparent 60%),
      radial-gradient(700px 300px at 90% 20%, rgba(98,216,202,.18), transparent 60%),
      var(--bg);color:var(--text);line-height:1.8;}
    .container{max-width:860px;margin:48px auto;padding:0 18px;}
    header{padding:26px 22px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.35);}
    h1{margin:0 0 6px;font-size:28px;}
    .subtitle{margin:0;color:var(--muted);font-size:14px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
    section{padding:18px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.04);}
    h2{margin:0 0 10px;font-size:16px;color:var(--muted);font-weight:700;}
    .tag{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(122,162,255,.12);font-size:12px;}
    .btn{display:inline-block;margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--accent);color:#000;font-weight:700;text-decoration:none;}
    footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center;}
    @media (max-width:720px){.grid{grid-template-columns:1fr;}h1{font-size:24px;}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>自己紹介</h1>
      <p class="subtitle">Web制作を学習中｜ポートフォリオ</p>
      <a class="btn" href="works.html">制作物一覧へ戻る</a>
    </header>

    <div class="grid">
      <section>
        <h2>名前</h2>
        <p>fka</p>
        <span class="tag">初心者OK</span>
      </section>

      <section>
        <h2>趣味</h2>
        <p>動画編集、データ分析など</p>
        <span class="tag">毎日学習中</span>
      </section>

      <section>
        <h2>目標</h2>
        <p>Web制作で稼ぐこと</p>
        <span class="tag">継続案件を目指す</span>
      </section>

      <section>
        <h2>できること</h2>
        <p>HTML / CSS（基礎）<br>JavaScript（学習中）</p>
        <span class="tag">丁寧・納期厳守</span>
      </section>
    </div>

    <footer>© 2026 Portfolio</footer>
  </div>
</body>
</html>
